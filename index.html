<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Coruña: Urbex & Planes Enérgicos</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      /* Modo Urbex (Oscuro) por defecto */
      --bg-color: #0b0d10;
      --card-bg: #15181e;
      --text-color: #e2e8f0;
      --accent-color: #00ff66;
      --accent-danger: #ff3344;
      --border-color: #262b35;
      --header-bg: #101216;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    body.mode-planes {
      /* Modo Planes (Energético y Luminoso) */
      --bg-color: #f0f4f9;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --accent-color: #0066ff;
      --accent-danger: #ff6600;
      --border-color: #cbd5e1;
      --header-bg: #ffffff;
      --shadow: 0 4px 20px rgba(0, 102, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--header-bg);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .logo-container h1 {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mode-switch-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .mode-switch-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }

    #sidebar {
      width: 400px;
      background-color: var(--header-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 500;
    }

    .search-box {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .location-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .location-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .location-card h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .location-card small {
      color: #888;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .badge-urbex {
      background-color: rgba(255, 51, 68, 0.15);
      color: var(--accent-danger);
      border: 1px solid var(--accent-danger);
    }

    .badge-planes {
      background-color: rgba(0, 102, 255, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }

    #map {
      flex: 1;
      height: 100%;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column-reverse;
      }
      #sidebar {
        width: 100%;
        height: 45%;
      }
      #map {
        height: 55%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1 id="app-title">👾 A Coruña Urbex</h1>
    </div>
    <button class="mode-switch-btn" id="mode-toggle">Cambiar a Planes ⚡</button>

    <div id="sidebar">

        <input type="text" id="search-input" placeholder="Buscar sitio o zona (Ej: Oleiros, Batería...)...">
      </div>
      <div class="location-list" id="list-container">
        <!-- Tarjetas dinámicas -->
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    let currentMode = 'urbex';
    let map, markersGroup;

    // Inicializar mapa centrado en A Coruña
    function initMap() {
      map = L.map('map').setView([43.3550, -8.3800], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      renderLocations();
    }

    // Renderizar lista y marcadores
    function renderLocations(filterText = '') {
      markersGroup.clearLayers();
      const listContainer = document.getElementById('list-container');
      listContainer.innerHTML = '';

      const filtered = locations
        .filter(loc => loc.type === currentMode)
        .filter(loc => 
          loc.title.toLowerCase().includes(filterText.toLowerCase()) || 
          loc.zone.toLowerCase().includes(filterText.toLowerCase())
        );

      filtered.forEach(loc => {
        // Marcador en Leaflet
        const marker = L.marker(loc.coords).addTo(markersGroup);
        marker.bindPopup(`
          <div style="font-family: sans-serif;">
            <strong style="font-size: 1rem;">${loc.title}</strong><br>
            <span style="color: #666; font-size: 0.8rem;">📍 ${loc.zone}</span><br><br>
            <p style="font-size: 0.85rem;">${loc.desc}</p><br>
            <small style="font-weight: bold; color: ${loc.type === 'urbex' ? '#e63946' : '#0066ff'};">
              ${loc.type === 'urbex' ? '⚠️ ' + loc.danger : '⚡ ' + loc.bestTime}
            </small>
          </div>
        `);

        // Tarjeta en barra lateral
        const card = document.createElement('div');
        card.className = 'location-card';
        card.innerHTML = `
          <h3>${loc.title}</h3>
          <small>📍 ${loc.zone}</small>
          <p style="font-size:0.85rem; margin-top:8px; line-height: 1.3;">${loc.desc}</p>
          <span class="badge ${loc.type === 'urbex' ? 'badge-urbex' : 'badge-planes'}">
            ${loc.type === 'urbex' ? '⚠️ ' + loc.danger : '⚡ ' + loc.bestTime}
          </span>
        `;

        card.onclick = () => {
          map.setView(loc.coords, 14);
          marker.openPopup();
        };

        listContainer.appendChild(card);
      });
    }

    // Interruptor de modo
    document.getElementById('mode-toggle').addEventListener('click', () => {
      const body = document.body;
      const title = document.getElementById('app-title');
      const btn = document.getElementById('mode-toggle');

      if (currentMode === 'urbex') {
        currentMode = 'planes';
        body.classList.add('mode-planes');
        title.innerText = "⚡ A Coruña Planes";
        btn.innerText = "Cambiar a Urbex 👾";
      } else {
        currentMode = 'urbex';
        body.classList.remove('mode-planes');
        title.innerText = "👾 A Coruña Urbex";
        btn.innerText = "Cambiar a Planes ⚡";
      }

      renderLocations(document.getElementById('search-input').value);
    });

    // Filtro de búsqueda
    document.getElementById('search-input').addEventListener('input', (e) => {
      renderLocations(e.target.value);
    });

    window.onload = initMap;
  </script>

      Enviar correo a TU_CORREO@gmail.com
